<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Facebook Assistant</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      color: #1c1e21;
    }

    .app {
      max-width: 500px;
      min-height: 100vh;
      margin: auto;
      padding: 18px;
    }

    .header {
      background: linear-gradient(135deg, #1877f2, #0b5ed7);
      color: white;
      text-align: center;
      padding: 30px 20px;
      border-radius: 22px;
      margin-bottom: 16px;
    }

    .logo {
      width: 70px;
      height: 70px;
      background: white;
      color: #1877f2;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: auto;
      font-size: 48px;
      font-weight: bold;
    }

    h1 {
      margin: 15px 0 8px;
      font-size: 27px;
    }

    .subtitle {
      margin: 0;
      opacity: 0.9;
      font-size: 14px;
    }

    .card {
      background: white;
      padding: 18px;
      border-radius: 20px;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .primary {
      background: #1877f2;
      color: white;
    }

    .secondary {
      background: #e7f3ff;
      color: #1877f2;
    }

    .help {
      background: #f0f2f5;
      color: #333;
    }

    .note {
      text-align: center;
      font-size: 11px;
      color: #777;
      margin-top: 18px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="header">
      <div class="logo">f</div>

      <h1>Facebook Assistant</h1>

      <p class="subtitle">
        Facebook tools inside Telegram
      </p>
    </div>

    <div class="card">

      <button class="primary" onclick="openFacebook()">
        Create Facebook Account
      </button>

      <button class="secondary" onclick="openPage()">
        Create Facebook Page
      </button>

      <button class="help" onclick="showHelp()">
        Security & Help
      </button>

    </div>

    <div class="note">
      Independent Telegram assistant.<br>
      Your Facebook password and verification codes are never requested by this app.
    </div>

  </div>

  <script>

    const tg = window.Telegram && window.Telegram.WebApp;

    if (tg) {
      tg.ready();
      tg.expand();
    }

    function openFacebook() {
      const url = "https://www.facebook.com/";

      if (tg && tg.openLink) {
        tg.openLink(url);
      } else {
        window.open(url, "_blank");
      }
    }

    function openPage() {
      const url = "https://www.facebook.com/pages/create/";

      if (tg && tg.openLink) {
        tg.openLink(url);
      } else {
        window.open(url, "_blank");
      }
    }

    function showHelp() {

      const message =
        "This Mini App uses Facebook's official website for account creation. " +
        "It does not collect your Facebook password, 2FA code, recovery code, " +
        "or attempt to bypass Facebook security or verification.";

      if (tg && tg.showPopup) {

        tg.showPopup({
          title: "Security",
          message: message,
          buttons: [
            {
              type: "ok"
            }
          ]
        });

      } else {
        alert(message);
      }
    }

  </script>

</body>
</html>
